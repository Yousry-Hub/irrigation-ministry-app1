<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#tealGlow)" stroke-width="6" opacity="0.4" />

  <!-- Inner Decorative Circle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#tealGlow)" stroke-width="3" stroke-dasharray="12 8" opacity="0.3" />

  <!-- Nile River Water Stream Silhouette -->
  <path d="M120 370 C 180 340, 210 390, 270 350 C 330 310, 360 360, 400 330 L 400 420 C 350 435, 300 410, 250 430 C 190 445, 150 410, 120 420 Z" fill="url(#waterGrad)" opacity="0.3" />
  <path d="M100 390 C 170 370, 220 410, 280 380 C 340 350, 370 390, 420 370 L 420 435 C 360 450, 310 430, 260 445 C 190 460, 140 430, 100 440 Z" fill="url(#waterGrad)" opacity="0.5" />

  <!-- Central Water Drop with Irrigation & S-Curve Vector -->
  <path d="M256 95 C 256 95, 370 240, 370 315 C 370 378, 319 425, 256 425 C 193 425, 142 378, 142 315 C 142 240, 256 95, 256 95 Z" fill="url(#waterGrad)" filter="url(#glow)" />
  
  <!-- Inner Drop Highlights -->
  <path d="M256 125 C 256 125, 345 250, 345 315 C 345 365, 305 400, 256 400 C 207 400, 167 365, 167 315 C 167 250, 256 125, 256 125 Z" fill="#0f766e" opacity="0.6" />

  <!-- Dam & Irrigation Sluice Gate Graphic Lines -->
  <path d="M200 320 L 312 320 M210 345 L 302 345 M225 370 L 287 370" stroke="#f0fdfa" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="280" x2="256" y2="395" stroke="#f0fdfa" stroke-width="6" stroke-linecap="round" />
  <line x1="225" y1="295" x2="225" y2="390" stroke="#f0fdfa" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="287" y1="295" x2="287" y2="390" stroke="#f0fdfa" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- S-Curve Trend Line Overlay (Golden) -->
  <path d="M185 300 Q 225 240, 256 260 T 325 200" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <circle cx="325" cy="200" r="8" fill="#fef08a" />
  <circle cx="185" cy="300" r="6" fill="#fef08a" />

  <!-- Ministry Emblem Star at Top -->
  <polygon points="256,55 264,75 285,75 268,88 274,108 256,96 238,108 244,88 227,75 248,75" fill="url(#goldGrad)" />
</svg>
